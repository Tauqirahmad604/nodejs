name: PROD | Deploy to EC2 and Restart PM2

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and Restart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_GIT_EC2 }} >> ~/.ssh/known_hosts

      - name: Pull latest code and restart PM2
        run: |
          ssh ${{ secrets.HOST_USER }}@${{ secrets.HOST_GIT_EC2 }} << 'EOF'
            cd /home/ubuntu/intelerad_server
            git pull origin main
            sudo pm2 restart intelerad-prod
          EOF

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": ":x: Deployment failed in *${{ github.repository }}* on branch *${{ github.ref_name }}*.\nCheck the workflow: ${{ github.workflow }}",
            "username": "GitHub Actions",
            "icon_emoji": ":octocat:"
          }' ${{ secrets.SLACK_WEBHOOK_URL }}
